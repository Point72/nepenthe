[package]
name = "nepenthe-core"
version = "0.1.0"
authors = ["The nepenthe authors <OpenSource@Point72.com>"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"
repository = "https://github.com/Point72/nepenthe"
description = "nepenthe core: manifest, composition, override layering, solve, and install"
# Internal-oriented (bundles recipes/examples); do not allow accidental crates.io publish.
publish = false

[lib]
name = "nepenthe_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "nepenthe"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.61", features = ["derive"] }
fsspec_rs = "0.1.1"
flate2 = "1.1.9"
jiff = "0.2"
rattler_conda_types = "0.47.1"
rattler_lock = "0.31.1"
rattler_repodata_gateway = { version = "0.29.5", features = ["gateway"] }
rattler_solve = "7.1.3"
rattler_virtual_packages = "3.0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
hex = "0.4.3"
toml = "0.8.23"
url = "2.5.8"
rattler = { version = "0.45", default-features = false, features = ["rustls"] }
rattler_cache = "0.10"
rattler_networking = { version = "0.29", default-features = false, features = ["rustls", "dirs"] }
rattler_shell = "0.27"
# Astral's fork; must match rattler's reqwest-middleware so client types unify.
# Provides the authenticated `reqwest::Client` used for private conda channels.
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
tar = "0.4.44"
minijinja = "2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

